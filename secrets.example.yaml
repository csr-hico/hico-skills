# Template for secrets.enc.yaml. These values are infra-revealing and MUST live ONLY in the
# SOPS-encrypted secrets.enc.yaml (or be set directly as Coolify env vars) - never in plaintext
# in the shared repo. Placeholders below use example.tld.
#
# To create the real, encrypted file:
#   cp secrets.example.yaml secrets.enc.yaml   # fill in real values
#   sops -e -i secrets.enc.yaml                # encrypt in place (uses .sops.yaml)
#
# The Entra app registration needs: redirect URIs https://<APP_DOMAIN>/auth/callback (MCP) and
# https://<APP_DOMAIN>/oauth2/callback (web), an "Expose an API" scope named mcp.access
# (admin-consented), and requestedAccessTokenVersion: 2 in the manifest.
# NOTE: Entra client secrets expire (max 24 months) - plan the rotation.

APP_DOMAIN: hico-skills.example.tld
PUBLIC_BASE_URL: https://hico-skills.example.tld
ENTRA_TENANT_ID: REPLACE_WITH_TENANT_GUID
OIDC_CLIENT_ID: REPLACE_WITH_APP_CLIENT_ID
OIDC_CLIENT_SECRET: REPLACE_WITH_CLIENT_SECRET
# 32 random bytes, base64url: python3 -c 'import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
OAUTH2_PROXY_COOKIE_SECRET: REPLACE_WITH_32_BYTE_BASE64
# MCP_SCOPE: mcp.access   # optional override of the custom API scope name
